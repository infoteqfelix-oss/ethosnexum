name: Build Éthos Nexum Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_APPLICATION_ID: com.ethosnexum.app
      APP_VERSION_NAME: 1.0.0
      APP_VERSION_CODE: 1
      GRADLE_VERSION: 8.13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

- name: Set up Java 21
  uses: actions/setup-java@v5
  with:
    distribution: temurin
    java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install web/Capacitor dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }} --distribution-type bin

      - name: Make wrapper executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Create temporary test signing key
        working-directory: android
        run: |
          keytool -genkeypair -v \
            -keystore test-release.jks \
            -storepass android \
            -keypass android \
            -alias ethosnexum-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Ethos Nexum Test, OU=Test, O=Ethos Nexum, L=Brazil, ST=SP, C=BR"

      - name: Build signed release APK and AAB
        working-directory: android
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/android/test-release.jks
          RELEASE_STORE_PASSWORD: android
          RELEASE_KEY_ALIAS: ethosnexum-test
          RELEASE_KEY_PASSWORD: android
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RELEASE_STORE_FILE" \
            -Pandroid.injected.signing.store.password="$RELEASE_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$RELEASE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$RELEASE_KEY_PASSWORD"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EthosNexum-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: EthosNexum-release-test-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload signed test AAB
        uses: actions/upload-artifact@v4
        with:
          name: EthosNexum-release-test-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload generated Gradle wrapper
        uses: actions/upload-artifact@v4
        with:
          name: EthosNexum-generated-Gradle-Wrapper
          path: |
            android/gradlew
            android/gradlew.bat
            android/gradle/wrapper/
          if-no-files-found: error
